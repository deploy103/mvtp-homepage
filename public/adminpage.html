<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HanSei Links 콘텐츠 관리 페이지입니다." />
    <title>Admin Page | HanSei Links</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260629-1" />
    <script defer src="admin.js?v=20260629-1"></script>
  </head>
  <body class="profile-body admin-body">
    <main class="admin-page">
      <header class="admin-hero">
        <div>
          <p class="eyebrow">Admin page</p>
          <h1>콘텐츠 관리</h1>
          <p>한세 바로가기 서비스 상태와 프로필 활동 내역을 수정합니다.</p>
        </div>
        <a class="button button-secondary profile-back" href="index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
          홈으로
        </a>
        <button class="button button-secondary profile-back" type="button" data-admin-logout>
          로그아웃
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
      </header>

      <form class="admin-layout" data-admin-form>
        <section class="admin-panel" aria-labelledby="server-status-title">
          <div class="admin-panel-heading">
            <div>
              <p class="eyebrow">Server status</p>
              <h2 id="server-status-title">서비스 상태</h2>
            </div>
            <span data-save-status>불러오는 중</span>
          </div>
          <div class="admin-service-list" data-service-editor></div>
        </section>

        <section class="admin-panel" aria-labelledby="activities-title">
          <div class="admin-panel-heading">
            <div>
              <p class="eyebrow">Activities</p>
              <h2 id="activities-title">활동 내역</h2>
            </div>
            <button class="button button-secondary admin-small-button" type="button" data-add-activity>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
              추가
            </button>
          </div>
          <div class="admin-activity-list" data-activity-editor></div>
        </section>

        <div class="admin-save-bar">
          <button class="button button-primary" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
              <path d="M17 21v-8H7v8" />
              <path d="M7 3v5h8" />
            </svg>
            저장하기
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
