<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MVTP Cloud 관리자 로그인 페이지입니다." />
    <title>Admin Login | MVTP Cloud</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260629-1" />
    <script defer src="admin-login.js?v=20260629-1"></script>
  </head>
  <body class="profile-body admin-body">
    <main class="admin-login-page">
      <form class="admin-login-card" data-admin-login-form>
        <p class="eyebrow">Admin page</p>
        <h1>관리자 로그인</h1>
        <label>
          <span>ID</span>
          <input type="text" name="id" autocomplete="username" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="button button-primary" type="submit">
          로그인
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <path d="m10 17 5-5-5-5" />
            <path d="M15 12H3" />
          </svg>
        </button>
        <p class="admin-login-message" data-login-message></p>
      </form>
    </main>
  </body>
</html>
